spring.application.name=acadence-user-management

# --- Server Configuration ---
# Sets the port the application will run on (default is 8080)
server.port=8892

# --- Database Configuration (MySQL) ---
# Replace 'your_database_name' with your actual schema name
spring.datasource.url=jdbc:mysql://localhost:3306/acadence
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate Properties ---
# 'update' will create or update tables automatically.
# Use 'none' or 'validate' in production!
spring.jpa.hibernate.ddl-auto=update

# Shows SQL queries in the console (useful for debugging)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect