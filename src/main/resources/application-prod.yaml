spring:
  datasource:
    url: jdbc:mysql://localhost:3306/acadence
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

# Enable or disable authentication
security:
  authentication-enabled: true
